        <h1>QuelleEcole.fr — Guide scolaire de Lille Métropole + Roubaix-Tourcoing</h1>
        <p>Comparez <strong>764 établissements scolaires</strong> de 85 communes de Lille Métropole + Roubaix-Tourcoing : Lille, Lambersart, Marcq-en-Baroeul, La Madeleine, Loos, Faches-Thumesnil, Ronchin, Mons-en-Baroeul, Roubaix, Tourcoing, Villeneuve-d'Ascq, Croix, Wattignies, Wasquehal et Hellemmes.</p>
        <h2>Données disponibles</h2>
        <p>Indice de Position Sociale (IPS) pour 249 établissements — Valeur ajoutée IVAL brevet et bac pour 26 lycées et 38 collèges — Évaluations nationales de 6ème (français et maths) pour 38 collèges — Carte scolaire Affelnet : 151 écoles avec leur collège de secteur — Prix annuel du privé pour 48 établissements — Spécialités (CHAM, International, Sport, CPGE, Hôtellerie…) pour 25 établissements.</p>
        <h2>Types d'établissements</h2>
        <p>69 maternelles, 52 élémentaires, 58 primaires, 50 collèges, 26 lycées. Public et privé.</p>
        <h2>Qu'est-ce qu'une « pépite » ?</h2>
        <p>Un établissement dont la valeur ajoutée au brevet ou au bac est ≥ +8 : il fait mieux réussir ses élèves que ne le laisserait prévoir leur profil social. Exemple : le Collège Miriam Makeba à Lille-Sud affiche +14 de valeur ajoutée au brevet 2024.</p>
