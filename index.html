    {
      "@context": "https://schema.org",

        {
          "@type": "Question",
          "name": "Qu'est-ce que l'IPS d'une école ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "L'IPS (Indice de Position Sociale) mesure le profil social des élèves d'un établissement sur une échelle d'environ 50 à 160. Plus l'IPS est élevé, plus le public est favorisé. Il est calculé par la DEPP à partir des professions des parents. L'IPS moyen en France est d'environ 103."
          }
        },
        {
          "@type": "Question",
          "name": "Qu'est-ce que la valeur ajoutée d'un collège ou lycée ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "La valeur ajoutée mesure la capacité d'un établissement à faire progresser ses élèves au-delà de ce qu'on attendrait vu leur profil social. Une valeur ajoutée de +5 signifie que l'établissement obtient 5 points de plus que la moyenne des établissements comparables."
          }
        },
        {
          "@type": "Question",
          "name": "Comment fonctionne la carte scolaire à Lille ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "La carte scolaire (Affelnet) affecte chaque école élémentaire à un collège de secteur en fonction de l'adresse de l'élève. À Lille Métropole, 107 écoles ont une affectation de collège connue. Les familles peuvent demander une dérogation."
          }
        },
        {
          "@type": "Question",
          "name": "Combien d'établissements scolaires y a-t-il à Lille Métropole ?",

        }
      ]
