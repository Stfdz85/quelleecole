<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="238" fill="none" stroke="#1B4F72" stroke-width="2.5" opacity="0.1"/>
  
  <!-- School icon -->
  <g transform="translate(256,128)">
    <polygon points="0,-48 -60,0 60,0" fill="#1B4F72"/>
    <rect x="-6" y="-61" width="12" height="16" rx="3" fill="#E67E22"/>
    <rect x="-48" y="0" width="96" height="64" rx="4" fill="#1B4F72"/>
    <rect x="-12" y="24" width="24" height="40" rx="12 12 0 0" fill="#E67E22"/>
    <rect x="-37" y="10" width="16" height="16" rx="3" fill="#f8fafc" opacity="0.9"/>
    <rect x="21" y="10" width="16" height="16" rx="3" fill="#f8fafc" opacity="0.9"/>
  </g>
  
  <!-- Quelle - centered -->
  <text x="256" y="278" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-weight="bold" font-size="58" letter-spacing="-1" fill="#1B4F72">Quelle</text>
  
  <!-- Ecole - left part of line 2 -->
  <text x="175" y="338" text-anchor="start" font-family="Trebuchet MS,sans-serif" font-weight="bold" font-size="58" letter-spacing="-1" fill="#1B4F72">Ecole</text>
  
  <!-- .fr - right part, orange -->
  <text x="338" y="338" text-anchor="start" font-family="Trebuchet MS,sans-serif" font-weight="bold" font-size="58" letter-spacing="-1" fill="#E67E22">.fr</text>
  
  <!-- Tagline -->
  <text x="256" y="378" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-weight="600" font-size="18" fill="#1B4F72" opacity="0.4" letter-spacing="4">LILLE MÉTROPOLE</text>
  
  <!-- IPS dots -->
  <circle cx="208" cy="412" r="7" fill="#D35400"/>
  <circle cx="232" cy="412" r="7" fill="#E67E22"/>
  <circle cx="256" cy="412" r="7" fill="#5DADE2"/>
  <circle cx="280" cy="412" r="7" fill="#2874A6"/>
  <circle cx="304" cy="412" r="7" fill="#1B4F72"/>
